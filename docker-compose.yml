networks:
  streaming-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  hls-data:

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: streaming-postgres
    networks:
      - streaming-network
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: streaming-redis
    networks:
      - streaming-network
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY}
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: streaming-rabbitmq
    networks:
      - streaming-network
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"    # AMQP
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"  # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  streaming-platform:
    image: maven:3.9-eclipse-temurin-21
    container_name: streaming-platform
    networks:
      - streaming-network
    working_dir: /app
    command: >
      bash -c "
      mvn spring-boot:run -Dspring-boot.run.jvmArguments='-Dspring.devtools.restart.enabled=true'
      "
    volumes:
      - ./app/backend/streaming-platform:/app
      - ~/.m2:/root/.m2
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RTMP_HOST: nginx-rtmp
      RTMP_PORT: 1935
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Nginx-RTMP Server
  nginx-rtmp:
    build:
      context: ./docker/nginx-rtmp
      dockerfile: Dockerfile
    container_name: streaming-nginx-rtmp
    networks:
      - streaming-network
    volumes:
      - hls-data:/tmp/hls
    ports:
      - "${RTMP_PORT}:1935"    # RTMP
      - "${HLS_PORT}:8081"     # HLS HTTP Server
    depends_on:
      - streaming-platform
    restart: unless-stopped
