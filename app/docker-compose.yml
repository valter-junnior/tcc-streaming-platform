networks:
  streaming-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  hls-data:

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: streaming-postgres
    networks:
      - streaming-network
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: streaming-rabbitmq
    networks:
      - streaming-network
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - ./docker/rabbitmq:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"    # AMQP
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"  # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  streaming-platform:
    image: maven:3.9-eclipse-temurin-21
    container_name: streaming-platform
    networks:
      - streaming-network
    working_dir: /app
    command: >
      bash -c "
      mvn spring-boot:run -Dspring-boot.run.jvmArguments='-Dspring.devtools.restart.enabled=true'
      "
    volumes:
      - ./backend/streaming-platform:/app
      - ~/.m2:/root/.m2
      - ./docker/logs/backend:/app/storage/logs
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      TRANSCODER: ${TRANSCODER:-ffmpeg}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # RTMP Server (Nginx-RTMP)
  rtmp-server-nginx:
    build:
      context: ./backend/rtmp/nginx
      dockerfile: Dockerfile
    container_name: streaming-rtmp-server-nginx
    profiles:
      - nginx
    networks:
      - streaming-network
    volumes:
      - ./docker/hls:/tmp/hls
      - ./docker/logs/rtmp:/var/log/transcode
    ports:
      - "${RTMP_PORT}:${RTMP_PORT}"    # RTMP
      - "${HLS_PORT}:${HLS_HTTP_PORT}"     # HLS HTTP Server
    environment:
      RTMP_PORT: ${RTMP_PORT}
      RTMP_CHUNK_SIZE: ${RTMP_CHUNK_SIZE}
      HLS_PATH: ${HLS_PATH}
      BACKEND_HOST: streaming-platform
      BACKEND_PORT: 8080
      HLS_HTTP_PORT: ${HLS_HTTP_PORT}
      HLS_RETENTION_HOURS: ${HLS_RETENTION_HOURS}
      TRANSCODER: ${TRANSCODER:-ffmpeg}
    depends_on:
      - streaming-platform
    restart: unless-stopped

  # RTMP Server (SRS)
  rtmp-server-srs:
    build:
      context: ./backend/rtmp/srs
      dockerfile: Dockerfile
    container_name: streaming-rtmp-server-srs
    profiles:
      - srs
    networks:
      - streaming-network
    volumes:
      - ./docker/hls:/tmp/hls
      - ./docker/logs/rtmp:/var/log/transcode
    ports:
      - "${RTMP_PORT}:${RTMP_PORT}"    # RTMP
      - "${HLS_PORT}:${HLS_HTTP_PORT}" # HLS HTTP Server
    environment:
      RTMP_PORT: ${RTMP_PORT}
      HLS_PATH: ${HLS_PATH}
      BACKEND_HOST: streaming-platform
      BACKEND_PORT: 8080
      HLS_HTTP_PORT: ${HLS_HTTP_PORT}
      HLS_RETENTION_HOURS: ${HLS_RETENTION_HOURS}
      TRANSCODER: ${TRANSCODER:-ffmpeg}
    depends_on:
      - streaming-platform
    restart: unless-stopped

  # Frontend React Application
  frontend:
    image: node:20-alpine
    container_name: streaming-frontend
    networks:
      - streaming-network
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT}:3001"
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT}
      VITE_API_URL: ${VITE_API_URL}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_RTMP_URL: ${VITE_RTMP_URL}
      VITE_HLS_URL: ${VITE_HLS_URL}
      VITE_APP_URL: ${VITE_APP_URL}
    depends_on:
      - streaming-platform
    restart: unless-stopped
