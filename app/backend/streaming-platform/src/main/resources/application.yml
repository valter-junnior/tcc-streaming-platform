server:
  port: 8080

spring:
  application:
    name: streaming-platform
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:streaming_db}
    username: ${DB_USER:streaming_user}
    password: ${DB_PASSWORD:streaming_pass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:streaming_user}
    password: ${RABBITMQ_PASSWORD:streaming_pass}
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

streaming:
  rtmp:
    # Provider: "nginx-rtmp" or "srs" (future implementation)
    provider: nginx-rtmp
    host: ${RTMP_HOST:nginx-rtmp}
    port: ${RTMP_PORT:1935}
    application: live
    callbackUrl: http://streaming-platform:8080/api/streams/callback
    url: rtmp://nginx-rtmp:1935/live
    stats-url: http://nginx-rtmp:8080/stat
  transcoding:
    # Provider: "ffmpeg" or "gstreamer" (future implementation)
    provider: ffmpeg
    segment-duration: 6
    playlist-length: 60
    output-path: /tmp/hls
    hardware-acceleration: false
    # Quality presets (if empty, uses defaults)
    qualities:
      - name: 1080p
        width: 1920
        height: 1080
        video-bitrate: 5000
        audio-bitrate: 128
        encoder-preset: medium
      - name: 720p
        width: 1280
        height: 720
        video-bitrate: 2800
        audio-bitrate: 128
        encoder-preset: medium
      - name: 480p
        width: 854
        height: 480
        video-bitrate: 1400
        audio-bitrate: 128
        encoder-preset: fast
      - name: 360p
        width: 640
        height: 360
        video-bitrate: 800
        audio-bitrate: 96
        encoder-preset: faster
  hls:
    base-url: http://localhost:8081/hls
  stream:
    waiting-timeout-minutes: 30
  metrics:
    collection-interval-seconds: 15
  cleanup:
    expired-streams-cron: "0 */5 * * * *"  # Every 5 minutes
    old-hls-files-cron: "0 0 * * * *"      # Every hour

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    doc-expansion: none

# Configuração de Logging
logging:
  file:
    name: ./storage/logs/application.log
    path: ./storage/logs
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p --- [%15.15t] %-40.40logger{39} : %m%n%ex"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p --- [%t] %-40.40logger{39} : %m%n%ex"
  level:
    root: INFO
    com.tcc.streaming: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB

---
# Perfil de Desenvolvimento
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: INFO
    com.tcc.streaming: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# Perfil de Produção
spring:
  config:
    activate:
      on-profile: prod
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    com.tcc.streaming: INFO
    org.springframework.web: WARN
