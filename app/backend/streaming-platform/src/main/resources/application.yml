server:
  port: 8080

spring:
  application:
    name: streaming-platform
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:streaming_db}
    username: ${DB_USER:streaming_user}
    password: ${DB_PASSWORD:streaming_pass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:streaming_user}
    password: ${RABBITMQ_PASSWORD:streaming_pass}
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

streaming:
  rtmp:
    # Provider: "nginx-rtmp" or "srs" (future implementation)
    provider: nginx-rtmp
    host: ${RTMP_HOST:nginx-rtmp}
    port: ${RTMP_PORT:1935}
    application: live
    callbackUrl: http://streaming-platform:8080/api/streams/callback
    url: rtmp://nginx-rtmp:1935/live
    stats-url: http://nginx-rtmp:8080/stat
  transcoding:
    # Provider: "ffmpeg" or "gstreamer" (future implementation)
    provider: ffmpeg
    segment-duration: 6
    playlist-length: 60
    output-path: /tmp/hls
    hardware-acceleration: false
    # Quality presets (if empty, uses defaults)
    qualities:
      - name: 1080p
        width: 1920
        height: 1080
        video-bitrate: 5000
        audio-bitrate: 128
        encoder-preset: medium
      - name: 720p
        width: 1280
        height: 720
        video-bitrate: 2800
        audio-bitrate: 128
        encoder-preset: medium
      - name: 480p
        width: 854
        height: 480
        video-bitrate: 1400
        audio-bitrate: 128
        encoder-preset: fast
      - name: 360p
        width: 640
        height: 360
        video-bitrate: 800
        audio-bitrate: 96
        encoder-preset: faster
  hls:
    base-url: http://localhost:8081/hls
  stream:
    waiting-timeout-minutes: 30
  metrics:
    collection-interval-seconds: 15
  cleanup:
    # Cleanup inactive streams (WAITING or LIVE) not updated for X days
    threshold-days: 1
    # Cron schedule: run daily at 3 AM (0 0 3 * * *)
    cron: "0 0 3 * * *"
    # HLS files cleanup - retention in hours
    hls-retention-hours: 6
    # Other cleanup tasks
    expired-streams-cron: "0 */5 * * * *"  # Every 5 minutes
    old-hls-files-cron: "0 0 * * * *"      # Every hour
    # Metrics aggregation
    metrics-aggregation-cron: "0 0 4 * * *"  # Daily at 4 AM
    old-events-cron: "0 0 5 * * SUN"         # Sundays at 5 AM

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    doc-expansion: none

---
# Perfil de Desenvolvimento
spring:
  config:
    activate:
      on-profile: dev

---
# Perfil de Produção
spring:
  config:
    activate:
      on-profile: prod
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
