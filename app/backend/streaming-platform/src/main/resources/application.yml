server:
  port: 8080

spring:
  application:
    name: streaming-platform
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:streaming_db}
    username: ${DB_USER:streaming_user}
    password: ${DB_PASSWORD:streaming_pass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:streaming_user}
    password: ${RABBITMQ_PASSWORD:streaming_pass}
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    doc-expansion: none

streaming:
  rtmp:
    url: rtmp://nginx-rtmp:1935/live
  hls:
    base-url: http://nginx-hls:8081/hls
  stream:
    waiting-timeout-minutes: 30
  nginx-rtmp:
    stats-url: http://nginx-rtmp:8080/stat
  metrics:
    collection-interval-seconds: 15
  cleanup:
    expired-streams-cron: "0 */5 * * * *"  # Every 5 minutes
    old-hls-files-cron: "0 0 * * * *"      # Every hour

---
# Perfil de Desenvolvimento
spring:
  config:
    activate:
      on-profile: dev
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.tcc.streaming: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# Perfil de Produção
spring:
  config:
    activate:
      on-profile: prod
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    com.tcc.streaming: INFO
    org.springframework.web: WARN
