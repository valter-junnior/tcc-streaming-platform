server:
  port: 8080

spring:
  application:
    name: streaming-platform
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  jackson:
    time-zone: America/Sao_Paulo
    serialization:
      write-dates-as-timestamps: false
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:streaming_db}
    username: ${DB_USER:streaming_user}
    password: ${DB_PASSWORD:streaming_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: StreamingHikariPool
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        '[format_sql]': true
  
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:streaming_user}
    password: ${RABBITMQ_PASSWORD:streaming_pass}
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true

stream:
  cleanup:
    threshold-days: 1
  rtmp-url: ${RTMP_URL:rtmp://localhost:1935/live}
  watch-base-url: ${WATCH_BASE_URL:http://localhost:3001/watch}

sse:
  # SSE connection timeout in milliseconds (30 minutes)
  timeout: 1800000
  # Keepalive interval in milliseconds (30 seconds)
  keepalive-interval: 30000
  # TTL cleanup interval in milliseconds (5 minutes)  
  ttl-cleanup-interval: 300000
  # Emitter TTL in hours (2 hours)
  emitter-ttl-hours: 2

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    doc-expansion: none

---
# Perfil de Desenvolvimento
spring:
  config:
    activate:
      on-profile: dev

---
# Perfil de Produção
spring:
  config:
    activate:
      on-profile: prod
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
