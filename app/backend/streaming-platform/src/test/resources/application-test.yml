spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  main:
    allow-bean-definition-overriding: true

  cache:
    type: simple
    cache-names: streams, streamStatus

rabbitmq:
  enabled: false

redis:
  enabled: false

logging:
  level:
    com.tcc.streaming: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

streaming:
  rtmp:
    provider: nginx-rtmp
    host: localhost
    port: 1935
    application: live
    callbackUrl: http://localhost:8080/api/streams/callback
  transcoding:
    provider: ffmpeg
    segment-duration: 6
    playlist-length: 60
    output-path: /tmp/hls
    hardware-acceleration: false
