spring:
  datasource:
    # Driver será configurado dinamicamente:
    # - Por @DynamicPropertySource para testes E2E com Testcontainers (PostgreSQL)
    # - Ou H2 in-memory para testes unit sem Testcontainers
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  main:
    allow-bean-definition-overriding: true

  cache:
    type: simple
    cache-names: streams, streamStatus
  
  # Disable RabbitMQ for unit tests
  rabbitmq:
    host: 

logging:
  level:
    com.tcc.streaming: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

streaming:
  rtmp:
    provider: nginx-rtmp
    host: localhost
    port: 1935
    application: live
    callbackUrl: http://localhost:8080/api/streams/callback
  transcoding:
    provider: ffmpeg
    segment-duration: 6
    playlist-length: 60
    output-path: /tmp/hls
    hardware-acceleration: false
