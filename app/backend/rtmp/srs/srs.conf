# SRS Configuration for Streaming Platform
# Arquivo de configuração do SRS para plataforma de streaming

listen              1935;
max_connections      1000;
srs_log_tank         file;
srs_log_level        trace;
srs_log_file         ./objs/srs.log;
daemon               on;

# HTTP API for callbacks and management
http_api {
    enabled         on;
    listen          8080;
    crossdomain     on;
}

# HTTP Server for HLS streaming
http_server {
    enabled         on;
    listen          8081;
    dir             ./objs/nginx/html;
}

# RTMP virtual host
vhost __defaultVhost__ {
    # Callbacks para integração com backend
    http_hooks {
        enabled         on;
        on_connect      http://streaming-platform:8080/api/streams/callback/connect;
        on_close        http://streaming-platform:8080/api/streams/callback/close;
        on_publish      http://streaming-platform:8080/api/streams/callback/publish;
        on_unpublish    http://streaming-platform:8080/api/streams/callback/unpublish;
        on_play         http://streaming-platform:8080/api/streams/callback/play;
        on_stop         http://streaming-platform:8080/api/streams/callback/stop;
    }

    # HLS configuration
    hls {
        enabled         on;
        hls_path        /var/srs-hls;
        hls_fragment    6;
        hls_window      60;
        hls_on_error    ignore;
        
        # HLS variants for multiple quality streams
        hls_dispose     30;
        hls_nb_notify   10;
    }

    # Transcoding for multiple qualities
    transcode {
        enabled     on;
        ffmpeg      /usr/local/bin/ffmpeg;
        
        engine live_1080p {
            enabled         on;
            vfilter {
                v               quiet;
                vf              scale=1920:1080;
            }
            vcodec          libx264;
            vbitrate        5000;
            vfps            30;
            vwidth          1920;
            vheight         1080;
            vthreads        8;
            vprofile        main;
            vpreset         medium;
            acodec          aac;
            abitrate        128;
            asample_rate    44100;
            achannels       2;
            output          rtmp://127.0.0.1:[port]/live/[stream]-1080p;
        }
        
        engine live_720p {
            enabled         on;
            vfilter {
                v               quiet;
                vf              scale=1280:720;
            }
            vcodec          libx264;
            vbitrate        2800;
            vfps            30;
            vwidth          1280;
            vheight         720;
            vthreads        4;
            vprofile        main;
            vpreset         medium;
            acodec          aac;
            abitrate        128;
            asample_rate    44100;
            achannels       2;
            output          rtmp://127.0.0.1:[port]/live/[stream]-720p;
        }
        
        engine live_480p {
            enabled         on;
            vfilter {
                v               quiet;
                vf              scale=854:480;
            }
            vcodec          libx264;
            vbitrate        1400;
            vfps            30;
            vwidth          854;
            vheight         480;
            vthreads        2;
            vprofile        main;
            vpreset         fast;
            acodec          aac;
            abitrate        128;
            asample_rate    44100;
            achannels       2;
            output          rtmp://127.0.0.1:[port]/live/[stream]-480p;
        }
        
        engine live_360p {
            enabled         on;
            vfilter {
                v               quiet;
                vf              scale=640:360;
            }
            vcodec          libx264;
            vbitrate        800;
            vfps            30;
            vwidth          640;
            vheight         360;
            vthreads        1;
            vprofile        main;
            vpreset         faster;
            acodec          aac;
            abitrate        128;
            asample_rate    44100;
            achannels       2;
            output          rtmp://127.0.0.1:[port]/live/[stream]-360p;
        }
    }
}

# Statistics
stats {
    network         0;
    disk            sda sdb xvda xvdb;
}