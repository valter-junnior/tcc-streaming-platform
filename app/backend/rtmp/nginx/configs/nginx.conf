worker_processes auto;
error_log /var/log/nginx/error.log info;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen ${RTMP_PORT};
        chunk_size ${RTMP_CHUNK_SIZE};

        application live {
            live on;
            record off;

            wait_key on;
            wait_video on;
            drop_idle_publisher off;

            on_publish http://${BACKEND_HOST}:${BACKEND_PORT}/api/streams/callback/publish;
            on_publish_done http://${BACKEND_HOST}:${BACKEND_PORT}/api/streams/callback/publish_done;

            exec /usr/local/bin/transcode.sh $name;
            exec_kill_signal term;

            allow play 127.0.0.1;
            allow play 172.16.0.0/12;
            deny play all;
        }
    }
}

http {
    include /usr/local/nginx/conf/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    sendfile on;
    keepalive_timeout 65;

    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    server {
        listen ${HLS_HTTP_PORT};
        server_name localhost;

        # HLS Playlists (.m3u8) - no cache, always fresh
        location ~ \.m3u8$ {
            if ($request_method = OPTIONS) {
                return 204;
            }

            types {
                application/vnd.apple.mpegurl m3u8;
            }

            root /tmp;

            add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Origin, Range, Accept-Encoding, Referer, User-Agent' always;
            add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;
            add_header Access-Control-Max-Age 3600 always;
        }

        # HLS Segments (.ts) - immutable once created, aggressive caching
        location ~ \.ts$ {
            if ($request_method = OPTIONS) {
                return 204;
            }

            types {
                video/mp2t ts;
            }

            root /tmp;

            add_header Cache-Control 'public, max-age=31536000, immutable' always;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Origin, Range, Accept-Encoding, Referer, User-Agent' always;
            add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;
            add_header Access-Control-Max-Age 3600 always;
        }

        location /stat {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;

            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;

            root /usr/local/nginx/html;
        }

        location /control {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;

            rtmp_control all;
        }

        location / {
            root /usr/local/nginx/html;
            index index.html;
        }
    }
}
