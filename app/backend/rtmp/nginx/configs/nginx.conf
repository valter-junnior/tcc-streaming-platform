worker_processes auto;
error_log /var/log/nginx/error.log info;

events {
    worker_connections 1024;
}

# RTMP configuration
rtmp {
    server {
        listen ${RTMP_PORT};
        chunk_size ${RTMP_CHUNK_SIZE};
        
        application live {
            live on;
            record off;
            
            # HTTP callbacks for authentication and stream lifecycle
            # on_publish: Validates stream key and starts the stream (returns 200 to accept, 403 to reject)
            on_publish http://${BACKEND_HOST}:${BACKEND_PORT}/api/streams/callback/publish;
            
            # on_publish_done: Called when publisher disconnects/stops streaming
            on_publish_done http://${BACKEND_HOST}:${BACKEND_PORT}/api/streams/callback/publish_done;
            
            # Execute transcoding on stream start (uses wrapper to choose engine)
            exec_push /usr/local/bin/transcode-wrapper.sh $name;
            
            # HLS configuration - Nginx-RTMP generates HLS directly
            hls on;
            hls_path ${HLS_PATH};
            hls_fragment ${HLS_FRAGMENT_DURATION};
            hls_playlist_length ${HLS_PLAYLIST_LENGTH};
            hls_nested on;
            
            # Access control for RTMP stream
            # Allow FFmpeg on localhost to read the stream
            allow play 127.0.0.1;
            # Allow Docker network (172.16.0.0/12)
            allow play 172.16.0.0/12;
            # Deny direct RTMP playback from external clients (they should use HLS)
            deny play all;
        }

    }
}

# HTTP configuration for serving HLS
http {
    include /usr/local/nginx/conf/mime.types;
    default_type application/octet-stream;
    
    access_log /var/log/nginx/access.log;
    
    sendfile on;
    keepalive_timeout 65;
    
    # Timeouts and limits
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    client_max_body_size 100M;
    
    # Proxy settings for callbacks
    proxy_connect_timeout 10s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    
    # HLS Server
    server {
        listen ${HLS_HTTP_PORT};
        server_name localhost;
        
        # Global CORS headers for all responses
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Origin, Range, Accept-Encoding, Referer, User-Agent' always;
        add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;
        add_header Access-Control-Max-Age 3600 always;
        
        # HLS Playlists (.m3u8) - No cache, always fresh
        location ~ \.m3u8$ {
            # Handle OPTIONS preflight
            if ($request_method = OPTIONS) {
                return 204;
            }
            
            types {
                application/vnd.apple.mpegurl m3u8;
            }
            
            root /tmp;
            
            # Playlists change frequently - no cache
            add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
            add_header Pragma 'no-cache' always;
            add_header Expires '0' always;
            
            # CORS (inherited + explicit for overrides)
            add_header Access-Control-Allow-Origin * always;
        }
        
        # HLS Segments (.ts) - Immutable, aggressive caching
        location ~ \.ts$ {
            # Handle OPTIONS preflight
            if ($request_method = OPTIONS) {
                return 204;
            }
            
            types {
                video/mp2t ts;
            }
            
            root /tmp;
            
            # Segments are immutable once created - aggressive caching
            add_header Cache-Control 'public, max-age=31536000, immutable' always;
            
            # Enable gzip compression
            gzip on;
            gzip_types video/mp2t;
            gzip_vary on;
            
            # CORS
            add_header Access-Control-Allow-Origin * always;
        }
        
        # Fallback for /hls directory (legacy/catchall)
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            
            root /tmp;
            
            # Default: no cache for safety
            add_header Cache-Control 'no-cache' always;
            add_header Access-Control-Allow-Origin * always;
        }
        
        location /stat {
            # RTMP statistics endpoint (protected)
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker network
            deny all;
            
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
        
        location /stat.xsl {
            # Protected stylesheet
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
            
            root /usr/local/nginx/html;
        }
        
        location /control {
            # RTMP control endpoint (protected - CRITICAL)
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
            
            rtmp_control all;
        }
        
        location / {
            root /usr/local/nginx/html;
            index index.html;
        }
    }
}
