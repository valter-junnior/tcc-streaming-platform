worker_processes auto;
error_log /var/log/nginx/error.log info;

events {
    worker_connections 1024;
}

# RTMP configuration
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        
        application live {
            live on;
            record off;
            
            # HTTP callbacks for authentication and notifications
            # These will be called by Nginx-RTMP to validate streams
            on_publish http://streaming-platform:8080/api/streams/callback/publish;
            on_publish_done http://streaming-platform:8080/api/streams/callback/publish_done;
            on_done http://streaming-platform:8080/api/streams/callback/done;
            
            # Execute FFmpeg for transcoding when stream starts
            exec_push /usr/local/bin/transcode.sh $name rtmp://localhost:1935/live/$name;
            
            # HLS configuration (base output - FFmpeg will create variants)
            hls on;
            hls_path /tmp/hls;
            hls_fragment 6s;
            hls_playlist_length 60s;
            hls_nested on;
            hls_cleanup on;
            
            # Deny playback from this application (use HLS server instead)
            deny play all;
        }
    }
}

# HTTP configuration for serving HLS
http {
    include /usr/local/nginx/conf/mime.types;
    default_type application/octet-stream;
    
    access_log /var/log/nginx/access.log;
    
    sendfile on;
    keepalive_timeout 65;
    
    # Map for handling OPTIONS requests
    map $request_method $options_handling {
        OPTIONS 204;
        default 0;
    }
    
    # HLS Server
    server {
        listen 8081;
        server_name localhost;
        
        # Global CORS headers for all responses
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Origin, Range, Accept-Encoding, Referer' always;
        add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;
        add_header Access-Control-Max-Age 3600 always;
        
        # HLS Playlists (.m3u8) - No cache, always fresh
        location ~ \.m3u8$ {
            # Handle OPTIONS preflight
            if ($request_method = OPTIONS) {
                return 204;
            }
            
            types {
                application/vnd.apple.mpegurl m3u8;
            }
            
            root /tmp;
            
            # Playlists change frequently - no cache
            add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
            add_header Pragma 'no-cache' always;
            add_header Expires '0' always;
            
            # CORS (inherited + explicit for overrides)
            add_header Access-Control-Allow-Origin * always;
        }
        
        # HLS Segments (.ts) - Immutable, aggressive caching
        location ~ \.ts$ {
            # Handle OPTIONS preflight
            if ($request_method = OPTIONS) {
                return 204;
            }
            
            types {
                video/mp2t ts;
            }
            
            root /tmp;
            
            # Segments are immutable once created - aggressive caching
            add_header Cache-Control 'public, max-age=31536000, immutable' always;
            
            # Enable gzip compression
            gzip on;
            gzip_types video/mp2t;
            gzip_vary on;
            
            # CORS
            add_header Access-Control-Allow-Origin * always;
        }
        
        # Fallback for /hls directory (legacy/catchall)
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            
            root /tmp;
            
            # Default: no cache for safety
            add_header Cache-Control 'no-cache' always;
            add_header Access-Control-Allow-Origin * always;
        }
        
        location /stat {
            # RTMP statistics endpoint
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
        
        location /stat.xsl {
            root /usr/local/nginx/html;
        }
        
        location /control {
            # RTMP control endpoint (drop clients, redirect, etc)
            rtmp_control all;
        }
        
        location / {
            root /usr/local/nginx/html;
            index index.html;
        }
    }
}
