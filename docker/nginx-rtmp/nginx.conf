worker_processes auto;
error_log /var/log/nginx/error.log info;

events {
    worker_connections 1024;
}

# RTMP configuration
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        
        application live {
            live on;
            record off;
            
            # HTTP callbacks for authentication and notifications
            # These will be called by Nginx-RTMP to validate streams
            on_publish http://streaming-platform:8080/api/streams/callback/publish;
            on_publish_done http://streaming-platform:8080/api/streams/callback/publish_done;
            on_done http://streaming-platform:8080/api/streams/callback/done;
            
            # Execute FFmpeg for transcoding when stream starts
            exec_push /usr/local/bin/transcode.sh $name rtmp://localhost:1935/live/$name;
            
            # HLS configuration (base output - FFmpeg will create variants)
            hls on;
            hls_path /tmp/hls;
            hls_fragment 6s;
            hls_playlist_length 60s;
            hls_nested on;
            hls_cleanup on;
            
            # Deny playback from this application (use HLS server instead)
            deny play all;
        }
    }
}

# HTTP configuration for serving HLS
http {
    include /usr/local/nginx/conf/mime.types;
    default_type application/octet-stream;
    
    access_log /var/log/nginx/access.log;
    
    sendfile on;
    keepalive_timeout 65;
    
    # HLS Server
    server {
        listen 8081;
        server_name localhost;
        
        # CORS headers for HLS playback
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Range' always;
        
        location /hls {
            # Serve HLS files
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin * always;
        }
        
        location /stat {
            # RTMP statistics endpoint
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
        
        location /stat.xsl {
            root /usr/local/nginx/html;
        }
        
        location /control {
            # RTMP control endpoint (drop clients, redirect, etc)
            rtmp_control all;
        }
        
        location / {
            root /usr/local/nginx/html;
            index index.html;
        }
    }
}
